name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch replaces a run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Lint, type-check, test, build and e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run type-check

      - name: Unit tests
        run: npm run test:unit

      # type-check already ran above, so only the bundle is built here.
      - name: Build
        run: npm run build-only

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      # Builds the e2e bundle (seed and rate hooks on) and runs it in Chrome, Firefox and Safari's engine.
      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  visual:
    name: Visual tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The image the baselines were made in (npm run test:visual), so fonts and rendering match.
    # Keep its tag in step with @playwright/test in package-lock.json.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: npm ci

      - name: Visual tests
        run: npx playwright test --project=visual

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
